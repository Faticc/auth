// Forge 1.7.10 mod build. Requires JDK 8 and the legacy ForgeGradle toolchain.
//
// The mod bundles grpc (for MCSkill's gRPC/TLS login) directly into the mod
// jar via the shadow plugin. grpc-netty-shaded already relocates its own
// Netty, so it will not clash with Minecraft 1.7.10's Netty 4.0.10; the one
// remaining conflict is Guava (MC ships 17, grpc needs a newer one), which is
// relocated below. GribLand login uses only the JDK + MC's bundled Gson, so
// it needs no extra dependency.
//
// NOTE: the exact reobf/shadow wiring differs between ForgeGradle forks. This
// is a working-reference configuration for FG 1.2-SNAPSHOT; adapt the `reobf`
// block if your workspace uses a different FG version. See README.md.

buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
        maven { name = "sonatype"; url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
        classpath 'com.github.jengelman.gradle.plugins:shadow:1.2.4'
    }
}

apply plugin: 'forge'
apply plugin: 'com.github.johnrengelman.shadow'

version = "0.1.0"
group = "net.faticc.reauth"
archivesBaseName = "mc-reauth-mod"

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
    mappings = "stable_12"
}

repositories {
    mavenCentral()
}

configurations {
    shade
    compile.extendsFrom shade
}

dependencies {
    def grpc = "1.60.0"
    shade "io.grpc:grpc-netty-shaded:${grpc}"
    shade "io.grpc:grpc-stub:${grpc}"
    shade "io.grpc:grpc-core:${grpc}"
    shade "io.grpc:grpc-api:${grpc}"
    shade "javax.annotation:javax.annotation-api:1.3.2"
}

shadowJar {
    configurations = [project.configurations.shade]
    classifier = ''

    // MC 1.7.10 ships Guava 17; grpc needs a newer Guava -> relocate ours so
    // both versions can coexist.
    relocate 'com.google.common', 'net.faticc.reauth.shade.guava'
    relocate 'com.google.thirdparty', 'net.faticc.reauth.shade.guava_tp'

    // Keep grpc's ServiceLoader provider registrations intact after bundling.
    mergeServiceFiles()

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'
}

// Reobfuscate the shaded jar (MCP names -> SRG) so it runs outside dev.
reobf {
    shadowJar { mappingType = 'SEARGE' }
}

tasks.reobf.dependsOn tasks.shadowJar
tasks.build.dependsOn tasks.reobf
