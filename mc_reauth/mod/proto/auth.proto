// Reconstructed from mcproto (github.com/Faticc/mcproto) for reference.
// Server: launchernew.mcskill.ru:443 (gRPC over TLS).
syntax = "proto3";
package launcher;
import "common.proto";
option java_package = "net.mcsgroup.launcher.proto";
option java_multiple_files = true;

message GetProfileRequest {}
message GetProfileResponse { PlayerProfile profile = 1; }

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  oneof result {
    Session session_data = 3;
    MfaChallenge mfa_required = 4;
  }
}

message Session {
  string id = 1;                 // session token used by the Minecraft client
  PlayerProfile profile = 2;
}

message MfaChallenge {}
message LogoutRequest {}
message LogoutResponse {}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
}
