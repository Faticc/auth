; mc_reauth DLL configuration (optional).
; Place this file next to the injected DLL (same folder).

[reauth]
; Loopback control port the DLL listens on. Must match the --port the
; Python side / admin tool connects to. Default is 5151.
port=5151

; ---------------------------------------------------------------------------
; Optional: pin the exact session field names for your client.
;
; You normally do NOT need this. On Forge 1.7.10 / 1.8.9 / 1.12.2 the DLL
; auto-detects the three Session fields by the shape of their current
; values, so leave this section empty.
;
; Fill it in only if auto-detection picks the wrong fields on an unusual
; client (e.g. a heavily customised or very new version). Use the runtime
; (SRG / obfuscated) field names of your net.minecraft.util.Session /
; net.minecraft.client.User class. Example for vanilla-MCP 1.7.10:
;
; [session]
; username=field_74286_a
; uuid=field_74287_b
; token=field_74285_c
